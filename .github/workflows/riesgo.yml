name: Riesgo Dorada

# Simula las senales del rango de la vela madre con 0,01 lotes: SL maximo, rachas y caida maxima. No envia nada.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  riesgo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests ccxt yfinance
      - run: python riesgo_dorada.py
