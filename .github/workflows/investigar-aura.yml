name: Investigar Aura (SpikeCharting)

# Lee las paginas PUBLICAS de SpikeCharting (sin iniciar sesion) para entender que es Aura y como funciona.
on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/investigar-aura.yml"
      - "herramientas/investigar_web.py"

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python herramientas/investigar_web.py
