name: Laboratorio

# Busca formulas con datos reales (triple barrera, ~830.000 combinaciones por mercado y temporalidad) y las
# confirma con datos nunca vistos. No envia nada a Telegram.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  laboratorio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests ccxt yfinance
      - run: python investigacion.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-laboratorio
          path: informe_laboratorio.json
