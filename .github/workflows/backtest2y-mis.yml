name: Backtest 2 anos (mis mercados)

# Backtest de ~2 anos en 15m (temporalidad de todas las ganadoras) con pruebas de robustez y lectura de estructura.
# TODAS las estrategias en los mercados de Cisco: EUR/USD, GBP/USD, USD/JPY, USD/CAD, Oro y BTC.
# Forex y oro: velas de Dukascopy (Yahoo solo da 60 dias en 5m/15m). BTC: exchanges via ccxt.
# Se lanza al subir cambios a este archivo, o a mano con "Run workflow".
# Estrategias incluidas: todas las de bot_pro.py (incluye la guia de sesiones, Hyenuk Chu, Dr. Inversor, Judas y la lectura de estructura).
on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/backtest2y-mis.yml"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        tf: ["15m"]
        mercado:
          - { activo: "EUR/USD", duka: "eurusd", tipo: "forex" }
          - { activo: "GBP/USD", duka: "gbpusd", tipo: "forex" }
          - { activo: "USD/JPY", duka: "usdjpy", tipo: "forex" }
          - { activo: "USD/CAD", duka: "usdcad", tipo: "forex" }
          - { activo: "XAU/USD (Oro)", duka: "xauusd", tipo: "oro" }
          - { activo: "BTC/USDT", duka: "", tipo: "cripto" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pandas numpy requests ccxt yfinance
      - name: Fechas
        run: |
          echo "DESDE=$(date -u -d '730 days ago' +%F)" >> "$GITHUB_ENV"
          echo "HASTA=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Descargar Dukascopy (${{ matrix.mercado.duka }} ${{ matrix.tf }})
        if: matrix.mercado.duka != ''
        run: |
          T=$([ "${{ matrix.tf }}" = "5m" ] && echo m5 || echo m15)
          npx --yes dukascopy-node -i ${{ matrix.mercado.duka }} -from "$DESDE" -to "$HASTA" -t $T -f csv -dir data
          ls -la data
      - name: Convertir CSV
        if: matrix.mercado.duka != ''
        shell: python
        run: |
          import glob, pandas as pd
          f = sorted(glob.glob("data/*.csv"))[0]
          d = pd.read_csv(f)
          d.columns = [c.lower() for c in d.columns]
          t = d["timestamp"]
          d.index = pd.to_datetime(t, unit="ms", utc=True) if pd.api.types.is_numeric_dtype(t) else pd.to_datetime(t, utc=True)
          if "volume" not in d:
              d["volume"] = 0.0
          if "${{ matrix.mercado.tipo }}" == "forex":
              d["volume"] = 0.0          # igual que en vivo: Yahoo no da volumen de forex
          d = d[["open", "high", "low", "close", "volume"]].astype(float)
          d = d[(d["high"] > d["low"]) | (d["volume"] > 0)]   # quita velas planas de mercado cerrado
          d.to_csv("datos.csv")
          print(f, len(d), d.index[0], d.index[-1])
      - name: Backtest
        run: |
          if [ -n "${{ matrix.mercado.duka }}" ]; then
            python bot_pro.py backtest --tf ${{ matrix.tf }} --csv datos.csv --nombre "${{ matrix.mercado.activo }}" --tipo ${{ matrix.mercado.tipo }} --salida res ${{ matrix.mercado.est && format('--estrategias {0}', matrix.mercado.est) || '' }}
          else
            python bot_pro.py backtest --tf ${{ matrix.tf }} --activos "${{ matrix.mercado.activo }}" --desde "$DESDE" --salida res ${{ matrix.mercado.est && format('--estrategias {0}', matrix.mercado.est) || '' }}
          fi
      - name: Nombre del artefacto
        id: n
        run: echo "n=$(echo '${{ matrix.mercado.activo }}-${{ matrix.tf }}' | tr -c 'A-Za-z0-9-' '_')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bt2m-${{ steps.n.outputs.n }}
          path: res/
          if-no-files-found: ignore

  resumen:
    needs: backtest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: todo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas tabulate
      - name: Robustez
        shell: python
        run: |
          import glob, os, numpy as np, pandas as pd
          fs = glob.glob("todo/*/*/operaciones.csv")
          if not fs:
              print("Sin resultados"); raise SystemExit
          ops = pd.concat(pd.read_csv(f).assign(TF=os.path.basename(os.path.dirname(f))) for f in fs)
          ops["mes"] = ops["senal_NY"].str[:7]
          ops["R_x2"] = ops["R_bruto"] - 2 * ops["coste_R"]
          filas = []
          for (e, a, tf), g in ops.groupby(["estrategia", "activo", "TF"]):
              g = g.sort_values("senal_NY")
              R = g["R"].to_numpy()
              gan, per = R[R > 0].sum(), -R[R < 0].sum()
              mitad = len(g) // 2
              meses = g.groupby("mes")["R"].sum()
              filas.append({"Estrategia": e, "Activo": a, "TF": tf, "Ops": len(g),
                            "Winrate%": round(100 * (R > 0).mean(), 1), "R prom": round(R.mean(), 3),
                            "PF": round(gan / per, 2) if per > 0 else np.inf,
                            "R prom coste x2": round(g["R_x2"].mean(), 3),
                            "R 1a mitad": round(g["R"].iloc[:mitad].mean(), 3) if mitad else np.nan,
                            "R 2a mitad": round(g["R"].iloc[mitad:].mean(), 3),
                            "Meses +": f"{(meses > 0).sum()}/{len(meses)}"})
          r = pd.DataFrame(filas)
          r["ROBUSTA"] = ((r["Ops"] >= 30) & (r["R prom"] > 0) & (r["R prom coste x2"] > 0) &
                          (r["R 1a mitad"] > 0) & (r["R 2a mitad"] > 0)).map({True: "SI", False: ""})
          r = r.sort_values(["ROBUSTA", "R prom"], ascending=[False, False])
          pd.set_option("display.width", 250)
          print(r.to_string(index=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("## Backtest 2 anos - robustez\n\n" + r.to_markdown(index=False) + "\n")
          r.to_csv("robustez_2y.csv", index=False)
          ops.to_csv("operaciones_2y.csv", index=False)
          # --- Lectura de estructura: ¿filtrar por el veredicto mejora la robustez? ---
          if "lectura" in ops:
              print("\n=== LECTURA DE ESTRUCTURA: todas las operaciones por veredicto ===")
              gl = ops.groupby("lectura")["R"].agg(ops="size", R_prom="mean",
                                                    winrate=lambda x: round(100 * (x > 0).mean(), 1)).round(3)
              print(gl.to_string())
              FILTROS = {"todas": ("CONFIRMA", "NEUTRAL", "CONTRADICE", "-"),
                         "sin_contradice": ("CONFIRMA", "NEUTRAL"), "solo_confirma": ("CONFIRMA",)}
              fl = []
              for (e, a, tf), g0 in ops.groupby(["estrategia", "activo", "TF"]):
                  for nf, perm in FILTROS.items():
                      g = g0[g0["lectura"].isin(perm)].sort_values("senal_NY")
                      if len(g) < 10:
                          continue
                      R = g["R"].to_numpy()
                      gan, per = R[R > 0].sum(), -R[R < 0].sum()
                      mitad = len(g) // 2
                      rob = (len(g) >= 30 and R.mean() > 0 and g["R_x2"].mean() > 0 and
                             g["R"].iloc[:mitad].mean() > 0 and g["R"].iloc[mitad:].mean() > 0)
                      fl.append({"Estrategia": e, "Activo": a, "TF": tf, "Filtro": nf, "Ops": len(g),
                                 "R prom": round(R.mean(), 3), "PF": round(gan / per, 2) if per > 0 else np.inf,
                                 "Costes x2": round(g["R_x2"].mean(), 3), "ROBUSTA": "SI" if rob else ""})
              lf = pd.DataFrame(fl)
              mejora = lf.pivot_table(index=["Estrategia", "Activo", "TF"], columns="Filtro", values="R prom")
              print("\n=== R promedio segun el filtro de lectura (combinaciones con 10+ ops) ===")
              print(mejora.round(3).to_string())
              print("\n=== ROBUSTAS con algun filtro de lectura ===")
              print(lf[lf["ROBUSTA"] == "SI"].sort_values("R prom", ascending=False).to_string(index=False))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
                  s.write("\n## Lectura de estructura\n\n" + gl.to_markdown() + "\n\n### Robustas con filtro\n\n"
                          + lf[lf["ROBUSTA"] == "SI"].to_markdown(index=False) + "\n")
              lf.to_csv("lectura_2y.csv", index=False)
      - uses: actions/upload-artifact@v4
        with:
          name: resultados-2y-mis
          path: "*.csv"
