name: Estudio BTC libros

# Prueba filtros para el BTC (Vantage, spread, horarios, momentum) sobre el rango de la vela madre. No envia nada.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  btc2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests ccxt yfinance
      - run: python estudio_btc2.py
