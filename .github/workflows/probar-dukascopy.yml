name: Probar Dukascopy

# Prueba minima (3 dias de EUR/USD): dice si Dukascopy deja de rechazar (403) las descargas desde GitHub.
on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/probar-dukascopy.yml"

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pedir 3 dias de datos
        run: |
          D=$(date -u -d '4 days ago' +%F); H=$(date -u -d '1 day ago' +%F)
          if npx --yes dukascopy-node -i eurusd -from "$D" -to "$H" -t m15 -f csv -dir data; then
            echo "RESULTADO: Dukascopy responde bien"; ls -la data
          else
            echo "RESULTADO: Dukascopy sigue rechazando"; exit 1
          fi
