name: Estado

# Envia "✅ activo y analizando" de Ballena EMAs, Ballena Pips, Ballena Rango, Ballena Liquidez, Ballena Riki CRT y Ballena Dorada a Telegram y termina (no interrumpe a los bots).
on:
  workflow_dispatch: {}

concurrency:
  group: ballenas-estado

permissions:
  contents: read

jobs:
  estado:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - name: Enviar estado
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          python ballena_emas.py --avisar-estado
          python ballena_pips.py --avisar-estado
          python ballena_rango.py --avisar-estado
          python ballena_liquidez.py --avisar-estado
          python ballena_riki.py --avisar-estado
          python ballena_dorada.py --avisar-estado
