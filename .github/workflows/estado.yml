name: Estado

# Envia "✅ activo y analizando" a Telegram y termina (no interrumpe al bot).
on:
  workflow_dispatch: {}

concurrency:
  group: bot-pro-estado

permissions:
  contents: read

jobs:
  estado:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - name: Enviar estado
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        shell: python
        run: |
          import bot_pro as b
          from datetime import datetime
          ok, msg = b.enviar_telegram(
              f"✅ ACTIVO Y ANALIZANDO · Bot Pro {b.VERSION_BOT}\n"
              f"Modo {b.CUENTA['modo']} · {len(b.mercados_vivos())} mercados · escaneo cada 5 minutos\n"
              f"Solo te llegan las señales operables.")
          print("Estado a Telegram:", "OK" if ok else msg)
          raise SystemExit(0 if ok else 1)
