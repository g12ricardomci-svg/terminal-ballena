name: Tests

# Corre los tests del bot (datos sinteticos, sin red ni Telegram) en cada push y en cada pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests pytest matplotlib
      - run: python -m pytest -q tests
